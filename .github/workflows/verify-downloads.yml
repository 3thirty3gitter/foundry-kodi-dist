name: Verify public Foundry downloads

on:
  workflow_run:
    workflows: ['Package Foundry release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foundry-public-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify both public hosts and the Kodi feed
        run: python tools/verify_public_downloads.py
      - name: Save verification evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/1.3.5-verification.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record verified public Foundry 1.3.5 downloads'
          git push origin HEAD:main

