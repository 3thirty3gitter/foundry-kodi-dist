name: Package Foundry release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "tools/**"
      - "tests/**"
      - "src/**"
      - "releases/1.5.4-source-snapshot.json.gz"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foundry-release
  cancel-in-progress: true

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: foundry-kodi-dist
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QA: releases/1.5.4-qa
      NATIVE_QA_IMAGE: foundry-native-qa:debian13-kodi21.2
    steps:
      - uses: actions/checkout@v4
        with:
          path: foundry-kodi-dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record validation identity
        run: |
          mkdir -p "$QA"
          git rev-parse HEAD > "$QA/source-commit.txt"
          printf '%s\n' "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" > "$QA/workflow-run.txt"
      - name: Install validation dependencies
        run: python -m pip install requests==2.34.2 Pillow==13.0.0
      - name: Restore pinned 1.5.4 source snapshots
        run: python tools/materialize_sources.py --release 1.5.4 2>&1 | tee "$QA/materialize.log"
      - name: Build and test committed sources
        run: |
          python tools/build_release.py --skin ../skin.foundry-nimbus --helper ../script.foundry.helper 2>&1 | tee "$QA/build.log"
          python tools/record_release_validation.py --check-scope
          python tools/run_tests.py --output "$QA/source-tests.json" 2>&1 | tee "$QA/source-tests.log"
          python tools/verify_release.py 2>&1 | tee "$QA/source-package-verification.log"
          cp release.json "$QA/release.json"
      - name: Test every extracted add-on and deterministic rebuild
        id: packaged
        run: |
          python tools/verify_packaged_sources.py --workspace "$RUNNER_TEMP/foundry-packaged-validation" --output "$QA" 2>&1 | tee "$QA/packaged-tests.log"
      - name: Install native Kodi validation environment
        id: kodi
        timeout-minutes: 8
        run: |
          docker build --platform linux/amd64 --tag "$NATIVE_QA_IMAGE" tools/native-qa 2>&1 | tee "$QA/native-image-build.log"
          docker image inspect "$NATIVE_QA_IMAGE" > "$QA/native-image-inspect.json"
          docker run --rm "$NATIVE_QA_IMAGE" cat /qa-package-versions.txt > "$QA/native-package-versions.txt"
          docker run --rm "$NATIVE_QA_IMAGE" kodi --version | tee "$QA/kodi-version.txt"
          docker run --rm "$NATIVE_QA_IMAGE" python3 -c 'import re, subprocess; version = subprocess.check_output(["kodi", "--version"], text=True); match = re.search(r"\b(\d+)\.\d+", version); assert match and int(match[1]) >= 21, "Native checks require Kodi 21 or newer"'
          docker run --rm "$NATIVE_QA_IMAGE" python3 --version | tee "$QA/native-python-version.txt"
      # Each renderer is sequential and manages its own portable profile/Xvfb.
      # Run later renderers even if an earlier native check fails, retaining all evidence.
      - name: Render library and catalog in native Kodi
        if: ${{ !cancelled() && steps.packaged.outcome == 'success' && steps.kodi.outcome == 'success' }}
        timeout-minutes: 6
        working-directory: ${{ runner.temp }}/foundry-packaged-validation/foundry-kodi-dist
        run: bash tools/run_native_qa.sh tools/render_library.py 2>&1 | tee "$GITHUB_WORKSPACE/foundry-kodi-dist/$QA/native-library-run.log"
      - name: Render cold-start splash in native Kodi
        if: ${{ !cancelled() && steps.packaged.outcome == 'success' && steps.kodi.outcome == 'success' }}
        timeout-minutes: 3
        working-directory: ${{ runner.temp }}/foundry-packaged-validation/foundry-kodi-dist
        run: bash tools/run_native_qa.sh tools/render_startup_splash.py 2>&1 | tee "$GITHUB_WORKSPACE/foundry-kodi-dist/$QA/native-splash-run.log"
      - name: Render interface and playback controls in native Kodi
        if: ${{ !cancelled() && steps.packaged.outcome == 'success' && steps.kodi.outcome == 'success' }}
        timeout-minutes: 8
        working-directory: ${{ runner.temp }}/foundry-packaged-validation/foundry-kodi-dist
        run: bash tools/run_native_qa.sh tools/render_interface.py 2>&1 | tee "$GITHUB_WORKSPACE/foundry-kodi-dist/$QA/native-interface-run.log"
      - name: Render Canadian weather in native Kodi
        if: ${{ !cancelled() && steps.packaged.outcome == 'success' && steps.kodi.outcome == 'success' }}
        timeout-minutes: 6
        working-directory: ${{ runner.temp }}/foundry-packaged-validation/foundry-kodi-dist
        run: bash tools/run_native_qa.sh tools/render_weather.py --output "$QA" 2>&1 | tee "$GITHUB_WORKSPACE/foundry-kodi-dist/$QA/native-weather-run.log"
      - name: Render Games in native Kodi
        if: ${{ !cancelled() && steps.packaged.outcome == 'success' && steps.kodi.outcome == 'success' }}
        timeout-minutes: 6
        working-directory: ${{ runner.temp }}/foundry-packaged-validation/foundry-kodi-dist
        run: bash tools/run_native_qa.sh tools/render_games.py --output "$QA/games" 2>&1 | tee "$GITHUB_WORKSPACE/foundry-kodi-dist/$QA/native-games-run.log"
      - name: Collect all native QA evidence
        if: always()
        run: |
          native="$RUNNER_TEMP/foundry-packaged-validation/foundry-kodi-dist/$QA"
          if [ -d "$native" ]; then
            mkdir -p "$QA/native"
            cp -a "$native/." "$QA/native/"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundry-1.5.4-release-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: foundry-kodi-dist/releases/1.5.4-qa/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish verified packages and repository feed together
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git diff --exit-code -- repository.foundry resource.images.foundry.wallpapers resource.images.foundry.osd
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/record_release_validation.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish verified Foundry 1.5.4 packages and native QA'
          git push origin HEAD:main
