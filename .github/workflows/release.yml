name: Package Foundry release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'tools/render_library.py'
      - 'releases/1.3.3-sources.json'
      - 'releases/1.3.3-source-snapshot.json.gz'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foundry-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: foundry-kodi-dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install requests==2.34.2 Pillow==13.0.0
      - name: Restore source snapshots verified against the private source commits
        working-directory: foundry-kodi-dist
        run: python tools/materialize_sources.py
      - name: Build and test committed sources
        working-directory: foundry-kodi-dist
        run: |
          python tools/build_release.py --skin ../skin.foundry-nimbus --helper ../script.foundry.helper
          python -m unittest discover -s tests -v
          python tools/verify_release.py
          cp release.json "$RUNNER_TEMP/foundry-first-build.json"
      - name: Verify actual packaged code and repeatable ZIPs
        working-directory: foundry-kodi-dist
        run: |
          python - <<'PY'
          import json, pathlib, shutil, zipfile
          root = pathlib.Path.cwd()
          for package in json.loads((root / 'release.json').read_text())['packages']:
              if package['id'] not in ('skin.foundry', 'script.foundry.helper'):
                  continue
              target = root.parent / ('skin.foundry-nimbus' if package['id'] == 'skin.foundry' else package['id'])
              shutil.rmtree(target)
              with zipfile.ZipFile(root / package['path']) as bundle:
                  bundle.extractall(root.parent)
              extracted = root.parent / package['id']
              if extracted != target:
                  extracted.rename(target)
          PY
          python -m unittest discover -s tests -v
          python tools/build_release.py --skin ../skin.foundry-nimbus --helper ../script.foundry.helper
          cmp release.json "$RUNNER_TEMP/foundry-first-build.json"
          python tools/verify_release.py
          git diff --exit-code -- repository.foundry resource.images.foundry.wallpapers resource.images.foundry.osd
      - name: Render and navigate Movies and TV in actual Kodi
        working-directory: foundry-kodi-dist
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y kodi xvfb xdotool python3-pil python3-requests libgl1-mesa-dri fonts-noto-core fonts-noto-mono fonts-roboto
          python tools/render_library.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: foundry-library-render-diagnostics
          path: foundry-kodi-dist/releases/1.3.3-qa/
      - name: Publish verified packages and repository feed together
        working-directory: foundry-kodi-dist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add addons.xml addons.xml.md5 index.html skin.html release.json
          git add releases/1.3.3-qa/*.png releases/1.3.3-qa/verification.json
          git add script.program.foundry-build.zip script.program.foundry-bootstrap.zip
          git add skin.foundry/skin.foundry-1.3.3.zip skin.foundry/skin.foundry-1.3.3.zip.sha256
          git add script.foundry.helper/script.foundry.helper-1.2.2.zip script.foundry.helper/script.foundry.helper-1.2.2.zip.sha256
          git add script.program.foundry-build/script.program.foundry-build-1.3.3.zip script.program.foundry-build/script.program.foundry-build-1.3.3.zip.sha256
          git add script.program.foundry-bootstrap/script.program.foundry-bootstrap-1.3.3.zip script.program.foundry-bootstrap/script.program.foundry-bootstrap-1.3.3.zip.sha256
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Foundry 1.3.3 StreamPilot library view'
          git push origin HEAD:main
