name: Validate media pack selector candidate
on:
  push:
    branches: [dev]
    paths:
      - 'candidates/media-selector-overlay/**'
      - 'tools/render_media_pack.py'
      - '.github/workflows/media-selector-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media-selector:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: foundry-kodi-dist
    env:
      QA: media-selector-qa
      NATIVE_QA_IMAGE: foundry-native-qa:debian13-kodi21.2
    steps:
      - uses: actions/checkout@v4
        with:
          path: foundry-kodi-dist
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore pinned baseline and test candidate
        run: |
          python -m pip install Pillow==13.0.0
          mkdir -p "$QA"
          python tools/materialize_sources.py --release 1.5.5
          python candidates/media-selector-overlay/test_media_pack.py 2>&1 | tee "$QA/source.log"
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('candidates/media-selector-overlay')
          for item in json.loads((root/'changed-files.json').read_text()):
              assert hashlib.sha256((root/item['file']).read_bytes()).hexdigest()==item['sha256'],item['file']
          PY
      - name: Build pinned native environment
        run: docker build --platform linux/amd64 --tag "$NATIVE_QA_IMAGE" tools/native-qa 2>&1 | tee "$QA/native-image.log"
      - name: Verify actual native selector and rendering
        run: |
          bash tools/run_native_qa.sh tools/render_media_pack.py --root . --stage candidates/media-selector-overlay --output "$QA/native" 2>&1 | tee "$QA/native.log"
          python -c "import json; assert json.load(open('media-selector-qa/native/native-report.json'))['passed'] is True"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-selector-qa-${{ github.run_id }}
          path: foundry-kodi-dist/media-selector-qa/**
